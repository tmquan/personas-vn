# Workspace-level pyproject.toml.
#
# personas-vn is a monorepo that scrapes Vietnamese government statistics from
# https://www.nso.gov.vn/, structures them through an ontology, and uses that
# ontology to generate Vietnamese persona datasets. A Gradio app surfaces all
# three layers (raw data, ontology, personas) for interactive exploration.
#
# Layout (mirrors ViLA's organisational philosophy: one workspace, many
# namespace packages under packages/, runnable apps under apps/):
#
#   packages/common/      - shared infra (config loader, HTTP, logging, paths)
#   packages/ontology/    - ontology schema (NSO domains + persona attributes)
#   packages/scraper/     - NSO scraper (WordPress REST client + mapper)
#   packages/personagen/  - PGM-inspired cascaded persona sampler
#   packages/pipeline/    - orchestrator (scrape -> map -> generate)
#   apps/visualizer/      - Gradio explorer
#
# Every package is a plain namespace package; nothing requires a per-package
# pyproject. Run modules with `python -m packages.<pkg>` or apps with
# `python -m apps.visualizer`.
#
# Install:
#   pip install -e ".[dev]"      # core + dev tooling
#   pip install -e ".[viz]"      # add Gradio for the visualizer
#   pip install -e ".[all]"      # everything

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personas-vn"
version = "0.1.0"
description = "Vietnamese personas: NSO scraper + ontology + PGM-style synthetic persona generator + visualizer"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "personas-vn contributors" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime: scraper + ontology + persona generator. The visualizer layer
# (gradio, plotly) ships as an optional extra so a user that only wants the
# data pipeline does not need to install a 200+ MB UI stack.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "tenacity>=8.2",
    "rich>=13.7",
    # Vietnamese full-name generator used by `packages.datagen` to build the
    # Nemotron-Personas-Vietnam datasets.
    "vn-fullname-generator>=0.0.2",
]

[project.optional-dependencies]
viz = [
    "gradio>=4.40",
    "plotly>=5.20",
    "networkx>=3.2",
]
# Curation extras: NeMo Curator (CPU executor) for the staged pipeline
# (download → parse → extract → embed → reduce, mirroring ViLA), plus a
# CPU-friendly multilingual embedding stack and UMAP for 2-D layout.
curator = [
    "nemo-curator[text_cpu]>=0.7",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5",
    "scikit-learn>=1.4",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",  # PX-Web HTML scraper writes xlsx; pandas needs openpyxl
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
all = [
    "personas-vn[viz,curator,dev]",
]

[project.scripts]
personas-vn = "packages.pipeline.cli:main"

[tool.setuptools.packages.find]
# Discover every `packages/*` and `apps/*` namespace package without
# declaring each one explicitly.
where = ["."]
include = ["packages*", "apps*"]
namespaces = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by formatter
    "B008",   # function calls in default args (used by Pydantic / CLI helpers)
    "B905",   # zip(strict=...) is 3.10+; opt-in case by case
    "RUF001", # ambiguous unicode (en-dash etc) — legitimate in Vietnamese text
    "RUF002", # ambiguous unicode in docstrings (× for cross-tabs, … etc)
    "RUF003", # ambiguous unicode in comments (same reason as RUF002)
    "RUF012", # mutable defaults on class attrs (we use this intentionally for AGE_MIDPOINTS etc)
    "B027",   # empty close() method on the EmbeddingBackend ABC is intentional
    "RUF005", # collection-literal concatenation; we use it intentionally for fixture lists
    "RUF022", # unsorted __all__: order intentionally tracks topological grouping
    "RUF102", # invalid rule code (false positive vs. ruff's own rule registry)
    "SIM108", # if-else vs ternary; readability preference, not a bug
]
